<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <script>document.documentElement.classList.replace('no-js','js')</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unli Chix — Unlimited Wings, Unli Sarap, Unli Sulit</title>
  <meta name="description" content="Unli Chix: Unlimited wings, chicken, fries, milktea, chaofan, ramen, and silog. One price, all you can eat.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ─── HERO ────────────────────────────────────────────────────────── */
    .hero {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 7rem 1.5rem 5rem;
      position: relative;
      overflow: hidden;
    }

    .hero-bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 40%;
      z-index: 0;
      display: block;
    }

    .hero-scrim {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(
        to bottom,
        oklch(0.09 0.04 30 / 0.88) 0%,
        oklch(0.09 0.04 30 / 0.52) 40%,
        oklch(0.09 0.04 30 / 0.88) 100%
      );
    }

    .hero-ambient {
      position: absolute;
      inset: 0;
      z-index: 2;
      background:
        radial-gradient(ellipse 65% 55% at 50% 48%, oklch(0.68 0.22 78 / 0.18) 0%, transparent 65%),
        radial-gradient(ellipse 40% 30% at 50% 48%, oklch(0.68 0.22 78 / 0.12) 0%, transparent 50%);
      pointer-events: none;
    }

    .hero-stars {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .star {
      position: absolute;
      border-radius: 50%;
      background: var(--gold);
      animation: twinkle var(--dur, 2s) var(--delay, 0s) ease-in-out infinite;
    }

    .hero-content {
      position: relative;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
    }

    .hero-eyebrow {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: var(--gold-dim);
    }

    .logo-wrap {
      position: relative;
      padding: 28px;
      width: clamp(300px, 48vw, 520px);
      aspect-ratio: 1;
      flex-shrink: 0;
    }

    .logo-ring {
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      border: 1.5px solid var(--gold);
      opacity: 0;
      pointer-events: none;
    }

    .logo-img {
      position: relative;
      z-index: 2;
      /* fills the inner content area, padding keeps rings from overlapping text */
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      filter: drop-shadow(0 0 48px oklch(0.68 0.22 78 / 0.55))
              drop-shadow(0 0 100px oklch(0.68 0.22 78 / 0.20));
    }

    .hero-heading {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(2.4rem, 5.5vw, 4.2rem);
      color: var(--white);
      line-height: 1.05;
      text-wrap: balance;
      max-width: 14ch;
    }

    .hero-heading .accent { color: var(--gold); }

    .hero-divider {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .hero-divider-line {
      width: 40px;
      height: 1px;
      background: oklch(0.83 0.19 85 / 0.35);
    }

    .hero-sub {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .hero-actions {
      display: flex;
      gap: 0.875rem;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>

  <nav class="nav" id="nav">
    <a href="index.html" class="nav-brand">Unli Chix</a>
    <ul class="nav-links">
      <li><a href="menu.html">Menu</a></li>
      <li><a href="branches.html">Branches</a></li>
      <li><a href="login.html" class="nav-cta">Order Now</a></li>
    </ul>
  </nav>

  <section class="hero" id="hero">
    <img
      class="hero-bg-img"
      src="https://images.unsplash.com/photo-1586793783658-261cddf883ef?auto=format&fit=crop&w=1920&q=75"
      srcset="
        https://images.unsplash.com/photo-1586793783658-261cddf883ef?auto=format&fit=crop&w=800&q=75 800w,
        https://images.unsplash.com/photo-1586793783658-261cddf883ef?auto=format&fit=crop&w=1200&q=75 1200w,
        https://images.unsplash.com/photo-1586793783658-261cddf883ef?auto=format&fit=crop&w=1920&q=75 1920w
      "
      sizes="100vw"
      alt="Crispy fried chicken on a wooden table, the Unli Chix signature"
      width="1920"
      height="1280"
      fetchpriority="high"
      decoding="async"
    >
    <div class="hero-scrim" aria-hidden="true"></div>
    <div class="hero-ambient"></div>
    <div class="hero-stars" id="heroStars" aria-hidden="true"></div>

    <div class="hero-content">
      <p class="hero-eyebrow">Filipino Unlimited Dining</p>

      <div class="logo-wrap" role="img" aria-label="Unli Chix logo">
        <div class="logo-ring" style="--ring-delay: 0s;"></div>
        <div class="logo-ring" style="--ring-delay: 0.8s;"></div>
        <img
          src="Assets/Unli%20Chix.png"
          alt="Unli Chix — Unlimited Wings, Chicken, Fries, Milktea"
          class="logo-img"
          width="480"
          height="480"
          fetchpriority="high"
        >
      </div>

      <h1 class="hero-heading">
        Eat <span class="accent">Unlimited.</span><br>Pay Once.
      </h1>

      <div class="hero-divider">
        <span class="hero-divider-line"></span>
        <span class="hero-sub">Wings · Chicken · Fries · Milktea · Ramen · Silog</span>
        <span class="hero-divider-line"></span>
      </div>

      <div class="hero-actions">
        <a href="menu.html" class="btn-primary">Explore the Feast</a>
        <a href="branches.html" class="btn-ghost">Find a Branch</a>
      </div>
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    // Nav scroll state
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('scrolled', window.scrollY > 60);
    }, { passive: true });

    // Stars — CSS twinkle, JS-generated positions
    (function () {
      const container = document.getElementById('heroStars');
      for (let i = 0; i < 22; i++) {
        const el = document.createElement('span');
        el.className = 'star';
        const size = 2 + Math.random() * 4;
        el.style.cssText = [
          `left: ${Math.random() * 100}%`,
          `top: ${Math.random() * 100}%`,
          `width: ${size}px`,
          `height: ${size}px`,
          `--dur: ${1.4 + Math.random() * 2.2}s`,
          `--delay: ${Math.random() * 2.5}s`,
          `opacity: ${0.15 + Math.random() * 0.45}`,
        ].join(';');
        container.appendChild(el);
      }
    })();

    // GSAP animations
    const mm = gsap.matchMedia();

    mm.add('(prefers-reduced-motion: no-preference)', () => {
      // Choreographed hero entrance
      gsap.timeline({ delay: 0.05, defaults: { ease: 'power3.out' } })
        .from('.hero-bg-img',     { opacity: 0, scale: 1.04, duration: 1.4, ease: 'power2.out' }, 0)
        .from('.hero-eyebrow',    { opacity: 0, y: 14, duration: 0.5 }, 0.35)
        .from('.logo-wrap',       { opacity: 0, scale: 0.87, duration: 0.75, ease: 'back.out(1.4)' }, 0.5)
        .from('.hero-heading',    { opacity: 0, y: 22, duration: 0.6 }, 0.8)
        .from('.hero-divider',    { opacity: 0, y: 12, duration: 0.45, ease: 'power2.out' }, 1.0)
        .from('.hero-actions > *', {
          opacity: 0, y: 12, duration: 0.4,
          ease: 'power2.out', stagger: 0.1
        }, 1.1);

      // Ring pulse — radiating from the logo outward
      document.querySelectorAll('.logo-ring').forEach((ring, i) => {
        gsap.fromTo(ring,
          { scale: 0.9,  opacity: 0.6 },
          { scale: 1.12, opacity: 0, duration: 2.2,
            ease: 'power1.out', repeat: -1,
            delay: i * 0.9, repeatDelay: 0.35 }
        );
      });
    });

    // Reduced motion: snap everything visible immediately
    mm.add('(prefers-reduced-motion: reduce)', () => {
      gsap.set(
        ['.hero-bg-img', '.hero-eyebrow', '.logo-wrap', '.hero-heading', '.hero-divider', '.hero-actions'],
        { opacity: 1, y: 0, scale: 1 }
      );
    });
  </script>
</body>
</html>
