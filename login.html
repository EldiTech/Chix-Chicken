<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <script>document.documentElement.classList.replace('no-js','js')</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Unli Chix</title>
  <meta name="description" content="Sign in to order your Unli Chix feast.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .signin-page {
      min-height: 100svh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 480px);
      position: relative;
      overflow: hidden;
      background: var(--bg);
    }

    .signin-visual {
      min-height: 100svh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 7rem 3rem 4rem;
      overflow: hidden;
    }

    .signin-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: saturate(1.04);
    }

    .signin-scrim {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 55% 55% at 50% 45%, oklch(0.68 0.22 78 / 0.18) 0%, transparent 68%),
        linear-gradient(to bottom, oklch(0.09 0.04 30 / 0.82), oklch(0.09 0.04 30 / 0.68));
    }

    .signin-brand {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1.4rem;
      max-width: 560px;
    }

    .signin-logo-wrap {
      width: clamp(230px, 34vw, 380px);
      aspect-ratio: 1;
      border-radius: 50%;
      padding: 18px;
      border: 1.5px solid oklch(0.83 0.19 85 / 0.28);
      box-shadow: 0 0 70px oklch(0.68 0.22 78 / 0.28);
    }

    .signin-logo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 50%;
      filter: drop-shadow(0 0 42px oklch(0.68 0.22 78 / 0.35));
    }

    .signin-heading {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(2.35rem, 5vw, 4.4rem);
      color: var(--white);
      line-height: 1.02;
      text-wrap: balance;
      max-width: 12ch;
    }

    .signin-heading .accent { color: var(--gold); }

    .signin-sub {
      color: var(--muted);
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .signin-panel {
      position: relative;
      z-index: 2;
      min-height: 100svh;
      display: flex;
      align-items: center;
      background: oklch(0.13 0.038 31 / 0.96);
      border-left: 1px solid oklch(0.83 0.19 85 / 0.10);
      padding: 7rem 2rem 4rem;
    }

    .signin-card {
      width: 100%;
      background: var(--surface);
      border: 1px solid oklch(0.83 0.19 85 / 0.12);
      border-radius: 18px;
      padding: 2rem;
      box-shadow: 0 24px 70px oklch(0 0 0 / 0.25);
    }

    .signin-kicker {
      font-family: 'Fredoka One', cursive;
      color: var(--gold-dim);
      font-size: 0.95rem;
      margin-bottom: 0.6rem;
    }

    .signin-title {
      font-family: 'Fredoka One', cursive;
      color: var(--white);
      font-size: clamp(1.9rem, 4vw, 2.55rem);
      line-height: 1.05;
      margin-bottom: 0.65rem;
    }

    .signin-copy {
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.55;
      margin-bottom: 1.6rem;
    }

    .signin-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .field-label {
      display: block;
      color: var(--cream);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.45rem;
    }

    .field-control {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-height: 3.35rem;
      background: oklch(0.11 0.035 30);
      border: 1px solid oklch(0.83 0.19 85 / 0.14);
      border-radius: 12px;
      padding: 0 0.9rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field-control:focus-within {
      border-color: oklch(0.83 0.19 85 / 0.48);
      box-shadow: 0 0 0 4px oklch(0.83 0.19 85 / 0.08);
    }

    .field-icon {
      width: 1.1rem;
      height: 1.1rem;
      color: var(--gold);
      flex: 0 0 auto;
    }

    .field-icon svg {
      display: block;
      width: 100%;
      height: 100%;
      stroke: currentColor;
    }

    .field-input {
      width: 100%;
      min-width: 0;
      color: var(--cream);
      background: transparent;
      border: 0;
      outline: 0;
      font: inherit;
      font-weight: 700;
    }

    .field-input::placeholder { color: oklch(0.60 0.025 78 / 0.68); }

    .signin-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin: 0.2rem 0 0.35rem;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 700;
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }

    .remember input {
      width: 1rem;
      height: 1rem;
      accent-color: var(--gold);
    }

    .signin-link {
      color: var(--gold);
      text-decoration: none;
      font-weight: 900;
    }

    .signin-link:hover { color: var(--gold-bright); }

    .signin-submit {
      width: 100%;
      justify-content: center;
      min-height: 3.35rem;
      margin-top: 0.25rem;
    }

    .signin-switch {
      padding-top: 1.1rem;
      margin-top: 1.25rem;
      border-top: 1px solid oklch(0.83 0.19 85 / 0.08);
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
      text-align: center;
    }

    @media (max-width: 880px) {
      .signin-page { grid-template-columns: 1fr; }

      .signin-visual {
        min-height: auto;
        padding: 6rem 1.5rem 2rem;
      }

      .signin-panel {
        min-height: auto;
        border-left: 0;
        padding: 1rem 1.25rem 3rem;
        background: transparent;
      }

      .signin-card {
        max-width: 520px;
        margin: 0 auto;
      }
    }

    @media (max-width: 480px) {
      .signin-logo-wrap { width: min(72vw, 260px); }
      .signin-card { padding: 1.4rem; border-radius: 16px; }
      .signin-options { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <svg aria-hidden="true" focusable="false" width="0" height="0" style="position:absolute; overflow:hidden;">
    <symbol id="icon-mail" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke-width="2"></rect>
      <path d="m4 7 8 6 8-6" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
    </symbol>
    <symbol id="icon-lock" viewBox="0 0 24 24">
      <rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke-width="2"></rect>
      <path d="M8 10V8a4 4 0 0 1 8 0v2" fill="none" stroke-width="2" stroke-linecap="round"></path>
    </symbol>
    <symbol id="icon-arrow-right" viewBox="0 0 24 24">
      <path d="M5 12h14" fill="none" stroke-width="2" stroke-linecap="round"></path>
      <path d="m13 6 6 6-6 6" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
    </symbol>
  </svg>

  <nav class="nav" id="nav">
    <a href="index.html" class="nav-brand">Unli Chix</a>
    <ul class="nav-links">
      <li><a href="menu.html">Menu</a></li>
      <li><a href="branches.html">Branches</a></li>
      <li><a href="login.html" class="nav-cta">Order Now</a></li>
    </ul>
  </nav>

  <main class="signin-page">
    <section class="signin-visual" aria-labelledby="signin-heading">
      <img
        class="signin-bg"
        src="https://images.unsplash.com/photo-1562967914-608f82629710?auto=format&fit=crop&w=1600&q=78"
        alt=""
        width="1600"
        height="1067"
        fetchpriority="high"
        decoding="async"
      >
      <div class="signin-scrim" aria-hidden="true"></div>
      <div class="signin-brand">
        <div class="signin-logo-wrap" role="img" aria-label="Unli Chix logo">
          <img
            src="Assets/Unli%20Chix.png"
            alt="Unli Chix - Unlimited Wings, Chicken, Fries, Milktea"
            class="signin-logo"
            width="480"
            height="480"
          >
        </div>
        <p class="signin-sub">Filipino Unlimited Dining</p>
        <h1 class="signin-heading" id="signin-heading">
          Your feast is <span class="accent">waiting.</span>
        </h1>
      </div>
    </section>

    <section class="signin-panel" aria-label="Sign in form">
      <div class="signin-card">
        <p class="signin-kicker">Welcome back</p>
        <h2 class="signin-title">Sign in to order</h2>
        <p class="signin-copy">Use your account to continue your Unli Chix order and find the nearest branch for pickup or dine-in.</p>

        <form class="signin-form" action="menu.html">
          <div>
            <label class="field-label" for="email">Email address</label>
            <div class="field-control">
              <span class="field-icon"><svg><use href="#icon-mail"></use></svg></span>
              <input class="field-input" id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
            </div>
          </div>

          <div>
            <label class="field-label" for="password">Password</label>
            <div class="field-control">
              <span class="field-icon"><svg><use href="#icon-lock"></use></svg></span>
              <input class="field-input" id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required>
            </div>
          </div>

          <div class="signin-options">
            <label class="remember">
              <input type="checkbox" name="remember">
              <span>Remember me</span>
            </label>
            <a class="signin-link" href="login.html">Forgot password?</a>
          </div>

          <button class="btn-primary signin-submit" type="submit">
            <span>Continue to order</span>
            <span class="field-icon"><svg><use href="#icon-arrow-right"></use></svg></span>
          </button>
        </form>

        <p class="signin-switch">
          New to Unli Chix? <a class="signin-link" href="login.html">Create an account</a>
        </p>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('scrolled', window.scrollY > 60);
    }, { passive: true });

    const mm = gsap.matchMedia();

    mm.add('(prefers-reduced-motion: no-preference)', () => {
      gsap.timeline({ defaults: { ease: 'power3.out' } })
        .from('.signin-bg', { opacity: 0, scale: 1.04, duration: 1.1, ease: 'power2.out' }, 0)
        .from('.signin-logo-wrap', { opacity: 0, scale: 0.9, duration: 0.65, ease: 'back.out(1.35)' }, 0.2)
        .from('.signin-sub', { opacity: 0, y: 12, duration: 0.45 }, 0.45)
        .from('.signin-heading', { opacity: 0, y: 18, duration: 0.55 }, 0.55)
        .from('.signin-card', { opacity: 0, x: 28, duration: 0.65 }, 0.35);
    });

    mm.add('(prefers-reduced-motion: reduce)', () => {
      gsap.set(['.signin-bg', '.signin-logo-wrap', '.signin-sub', '.signin-heading', '.signin-card'], {
        opacity: 1,
        x: 0,
        y: 0,
        scale: 1
      });
    });
  </script>
</body>
</html>
